name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # turbo-ignore y `--filter=[HEAD^1]` necesitan historia para comparar.
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          # El release enlaza los errores de Sentry con este commit.
          APP_RELEASE: ${{ github.sha }}
          SENTRY_ORG: teams4soft
          SENTRY_PROJECT_FRONTEND: tess-frontend
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  migrations:
    name: supabase · validar migraciones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Genera signing keys efímeras para que el CLI pueda arrancar sin secrets de producción.
      - run: node scripts/ensure-signing-keys.mjs
      # Levanta Postgres y aplica migrations/ + seed.sql de cero.
      # Detecta SQL roto antes de que llegue a la base remota.
      - run: supabase db start
      - run: supabase db lint --level warning
